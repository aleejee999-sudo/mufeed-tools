<div class="wrap">
  {{crumbs}}
  <h1>{{page.h1}}</h1>
  <p class="lead">{{page.lead}}</p>
  {{toolTabs}}

  <section class="panel" id="tool-wa">
    <div class="row2">
      <div class="field"><label for="wa-cc">{{page.lblCc}}</label>
        <select id="wa-cc">
          {{#each page.countries}}<option value="{{this.c}}">{{this.n}} (+{{this.c}})</option>
          {{/each}}
        </select></div>
      <div class="field"><label for="wa-number">{{page.lblNum}}</label><input type="tel" id="wa-number" class="ltr" inputmode="tel" autocomplete="off" placeholder="{{page.numPh}}"></div>
    </div>
    <div class="field"><label for="wa-msg">{{page.lblMsg}}</label><textarea id="wa-msg"></textarea></div>
    <div class="btn-row">
      <button type="button" class="btn" id="wa-open">{{page.open}}</button>
      <button type="button" class="btn ghost" id="wa-copy">{{page.copy}}</button>
    </div>
    <div class="field" style="margin-top:14px"><label for="wa-link">{{page.lblLink}}</label><input type="text" id="wa-link" class="ltr" readonly></div>
    <p class="note">{{page.note}}</p>
  </section>

  <h2>{{page.howTitle}}</h2>
  <ol class="prose">
    {{#each page.how}}<li>{{this}}</li>
    {{/each}}
  </ol>

  <h2>{{page.faqTitle}}</h2>
  {{#each page.faq}}<details><summary>{{this.q}}</summary><div><p>{{this.a}}</p></div></details>
  {{/each}}
</div>
